name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ─────────────────────────────────────────────
  # JOB 1: Test Backend
  # ─────────────────────────────────────────────
  test-backend:
    name: 🧪 Laravel Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: enterprise_test
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, redis, zip, gd, bcmath, mbstring
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install & Test (skip if Laravel not ready)
        run: |
          if [ ! -f backend/composer.json ]; then
            echo "⚠️ backend/composer.json not found - skipping backend tests"
            exit 0
          fi
          cd backend
          composer install --no-interaction --prefer-dist --no-progress
          # Setup .env.testing
          cat > .env.testing << 'EOF'
          APP_ENV=testing
          APP_KEY=
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=enterprise_test
          DB_USERNAME=root
          DB_PASSWORD=secret
          CACHE_STORE=array
          QUEUE_CONNECTION=sync
          JWT_SECRET=test-jwt-secret-key-for-ci
          EOF
          php artisan key:generate --env=testing
          php artisan migrate --env=testing --force
          php artisan test --env=testing
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306

  # ─────────────────────────────────────────────
  # JOB 2: Test Frontend
  # ─────────────────────────────────────────────
  test-frontend:
    name: 🧪 React Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build (skip if not ready)
        run: |
          if [ ! -f frontend/package.json ]; then
            echo "⚠️ frontend/package.json not found - skipping"
            exit 0
          fi
          cd frontend
          npm ci
          npx tsc --noEmit || echo "⚠️ TypeScript warnings (non-blocking)"
          npm run build
        env:
          VITE_API_URL: http://localhost

  # ─────────────────────────────────────────────
  # JOB 3: Deploy — เปิดใช้เมื่อพร้อม
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy
    needs: [test-backend, test-frontend]
    # ⬇️ เปลี่ยน 'false' เป็น 'true' เมื่อมี server พร้อม
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/enterprise-system
            git pull origin main
            docker compose up -d --build
            docker compose exec -T backend php artisan migrate --force
            docker compose exec -T backend php artisan optimize