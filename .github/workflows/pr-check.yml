name: PR Check

on:
  pull_request:
    branches: [main, develop]

jobs:
  lint-frontend:
    name: 🔍 TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: TypeScript
        run: cd frontend && npx tsc --noEmit
      - name: Build
        run: cd frontend && npm run build
        env:
          VITE_API_URL: http://localhost

  lint-backend:
    name: 🔍 PHP Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, zip, gd, bcmath, mbstring
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: cd backend && composer install --no-interaction --prefer-dist
      - name: PHP Syntax Check
        run: find backend/app -name "*.php" -exec php -l {} \; | grep -v "No syntax errors" || true
